# 개발 환경 전용 덮어쓰기입니다. 운영 스크립트는 `-f compose.yaml`을 명시하므로
# 아래 build와 소스 mount가 운영 컨테이너에 실수로 적용되지 않습니다.
x-development-app: &development-app
  # 개발에서는 현재 작업 트리로 이미지를 만들 수 있도록 build 설정을 복원합니다.
  build:
    context: .
    dockerfile: dockerfile
  volumes:
    # 코드 수정이 즉시 반영되도록 site를 mount하고 운영용 로컬 설정 파일만 읽기 전용으로 씁니다.
    - ./site:/app/site
    - ./site/dmoj/settings.example.py:/app/site/dmoj/settings.py:ro
    - ./docker/django/local_settings.py:/app/site/dmoj/local_settings.py:ro
  environment:
    # 로컬 HTTP 접속이 HTTPS로 강제 이동하지 않도록 개발 환경에서만 보안 redirect를 끕니다.
    DEBUG: "True"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    SECURE_SSL_REDIRECT: "False"
    SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
    SECURE_HSTS_PRELOAD: "False"
    SESSION_COOKIE_SECURE: "False"
    CSRF_COOKIE_SECURE: "False"

services:
  # 애플리케이션 이미지를 쓰는 모든 Django 계열 서비스에 같은 개발 설정을 적용합니다.
  init:
    <<: *development-app
  web-blue:
    <<: *development-app
    # Python 변경을 감지해 자동 재시작하는 Django 개발 서버를 사용합니다.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
  web-green:
    <<: *development-app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
  celery-blue:
    <<: *development-app
  celery-green:
    <<: *development-app
  bridge:
    <<: *development-app
