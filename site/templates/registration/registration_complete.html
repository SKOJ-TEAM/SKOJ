{% extends "base.html" %}

{% block media %}
<style>
    .title-div {
        display: none;
    }
    #page-container {
        background: var(--page-bg) !important;
    }
    footer {
        background: var(--page-bg) !important;
    }
    .message-container {
        max-width: 500px;
        margin: 120px auto;
        padding: 40px 30px;
        background-color: var(--page-bg);
        border: 1px solid var(--border-secondary);
        border-radius: 10px;
        text-align: center;
    }
    .message-title {
        font-size: 22px;
        font-weight: 600;
        color: var(--font-basic-black);
        margin-bottom: 12px;
    }
    .message-text {
        font-size: 15px;
        color: var(--font-grey);
        line-height: 1.6;
    }
</style>

{% endblock %}
{% block body %}
    <div class="message-container">
        <p class="message-title">{{ _('회원가입이 완료되었습니다!') }}</p>
        <p class="message-text">
            {{ _('계정이 활성화되어 바로 로그인할 수 있습니다.') }}<br><br>
            <a href="{{ url('auth_login') }}">{{ _('로그인하기') }}</a>
        </p>
    </div>
{% endblock %}
