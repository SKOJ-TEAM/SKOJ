<head>
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous"
  >
</head>
<form method="get">
  {% for key, value in request.GET.items %}
    {% if key not in spec.filter_keys %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
    {% endif %}
    {% endfor %}
<label>
  사용자 이름
  <input type="text" name="username" value="{{ request.GET.username }}" placeholder="사용자 이름">
</label>
<label>
  이메일
  <input type="text" name="email" value="{{request.GET.email}}" placeholder="이메일">
</label>
<label>기수
  <select name="cohort">
    <option value="">기수</option>
    {% for value, label in spec.cohort_lookups %}
      <option value="{{ value }}" {% if request.GET.cohort == value|stringformat:"s" %}selected{% endif %}>{{ label }}기</option>
    {% endfor %}
  </select>
</label>
<label>캠퍼스
  <select name="campus">
    <option value="">캠퍼스</option>
    {% for value, label in spec.campus_lookups %}
      <option value="{{ value }}" {% if request.GET.campus == value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</label>
<label>반
  <select name="training_class">
    <option value="">반</option>
    {% for value, label in spec.training_class_lookups %}
      <option value="{{ value }}" {% if request.GET.training_class == value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</label>
<label>
  시간대
<select name="timezone">
  <option value="">시간대</option>
  {% for value, label in spec.timezone_lookups %}
    <option value="{{ value }}" {% if request.GET.timezone == value %}selected{% endif %}>
      {{ label }}
    </option>
  {% endfor %}
</select>
</label>
<label>
  IP 주소
<input type="text" name="IP" value="{{ request.GET.IP }}" placeholder="IP 주소">
</label>

  <button type="submit" style="font-size: 14px;">
  <i class="fa-solid fa-filter"></i> 필터 적용
</button>
</form>
