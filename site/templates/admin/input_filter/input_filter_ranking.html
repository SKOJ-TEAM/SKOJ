<form method="get">
  {% for key, value in request.GET.items %}
    {% if key not in spec.filter_keys and key != 'p' %}
      <input type="hidden" name="{{ key }}" value="{{ value }}">
    {% endif %}
  {% endfor %}
  <label>
    현재 티어
    <select name="current_tier__exact">
      <option value="">모두</option>
      {% for value, label in spec.lookup_choices %}
        <option value="{{ value }}" {% if spec.value == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit" style="font-size: 14px;">
    <i class="fa fa-filter" aria-hidden="true"></i> 필터 적용
  </button>
</form>
