# Git으로 관리하는 SKOJ virtual host 원본입니다. setup-deployment.sh가 설치하며
# 일반 배포는 이 파일을 다시 쓰지 않고 /etc/nginx/skoj/active.conf만 전환합니다.
server {
    # 모든 평문 HTTP 요청을 같은 host와 경로의 HTTPS로 이동합니다.
    listen 80;
    listen [::]:80;
    server_name 113.198.66.76 172.22.204.85 skoj.site www.skoj.site 35.216.35.68;
    return 301 https://$host$request_uri;
}

server {
    # 실제 서비스 요청을 처리하는 TLS virtual host입니다.
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name 113.198.66.76 172.22.204.85 unix.jbnu.ac.kr litmus.jbnu.ac.kr skoj.site www.skoj.site 35.216.35.68;

    # 인증서 갱신은 Certbot이 담당하며 배포 스크립트는 인증서와 개인키를 수정하지 않습니다.
    ssl_certificate /etc/letsencrypt/live/skoj.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skoj.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    charset utf-8;

    location ~* ^/(wp-json|wp-admin|wp-includes|wp-content)|/wp-login\.php$|/xmlrpc\.php$ {
        return 404;
    }

    try_files $uri @icons;
    # upstream 장애와 의도적인 503을 동일한 내부 Maintenance 페이지로 처리합니다.
    error_page 502 503 504 /skoj-maintenance.html;

    location = /skoj-maintenance.html {
        # 외부에서 파일 URL을 직접 열 수 없고 장애 응답을 캐시하지 않게 합니다.
        internal;
        root /etc/nginx/skoj;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    location ~ ^/502\.html$|^/logo\.png$|^/robots\.txt$ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com maxcdn.bootstrapcdn.com; font-src 'self' maxcdn.bootstrapcdn.com cdnjs.cloudflare.com; img-src 'self' data: www.gravatar.com gravatar.com;" always;
        root /home/songg9572/site;
    }

    location @icons {
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com maxcdn.bootstrapcdn.com; font-src 'self' maxcdn.bootstrapcdn.com cdnjs.cloudflare.com; img-src 'self' data: www.gravatar.com gravatar.com;" always;
        root /home/songg9572/site/resources/icons;
        error_page 403 = @gunicorn;
        error_page 404 = @gunicorn;
    }

    location @gunicorn {
        # active.conf가 Blue, Green, Maintenance 또는 최초 Legacy route 중 하나를 선택합니다.
        include /etc/nginx/skoj/active.conf;
        # Django가 원래 host, client IP, HTTPS 여부를 알 수 있도록 proxy header를 전달합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    location ~ ^/(about|status)/ {
        try_files $uri @gunicorn;
    }

    location = /media/ { return 404; }
    location ^~ /media/ {
        # 사용자가 올린 media는 공유 영속 디렉터리에서 직접 제공하며 목록 조회는 막습니다.
        alias /home/songg9572/SKOJ/data/media/;
        access_log off;
        autoindex off;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /static { return 404; }
    location /static/ {
        # URL에 RELEASE_ID가 포함되어 롤백 중에도 이전 정적 파일 URL이 계속 유효합니다.
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com maxcdn.bootstrapcdn.com; font-src 'self' maxcdn.bootstrapcdn.com cdnjs.cloudflare.com; img-src 'self' data: www.gravatar.com gravatar.com;" always;
        alias /home/songg9572/SKOJ/data/static/;
        gzip_static on;
        expires max;
        autoindex off;
        try_files $uri =404;
    }

    # JPlag viewer/report가 일반 collectstatic 릴리스 트리로 이전될 때까지 기존 경로를 보존합니다.
    location /static/jplag_reports/ {
        root /home/songg9572/site/resources;
    }
    location /static/jplag-viewer/ {
        root /home/songg9572/site/resources;
        index index.html;
        try_files $uri $uri/ /static/jplag-viewer/index.html;
    }
}
