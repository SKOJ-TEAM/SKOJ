name: skoj

# 운영 애플리케이션은 호스트 소스가 아니라 불변 이미지에 포함된 코드만 실행합니다.
# 개발용 build와 소스 mount는 compose.override.yaml에서만 추가합니다.
x-app: &app
  # 서버 재부팅과 일시 장애 후에는 다시 시작하되 관리자가 중지한 경우는 존중합니다.
  restart: unless-stopped
  # PID 1이 종료된 자식 프로세스를 회수하도록 Docker의 작은 init을 사용합니다.
  init: true
  env_file:
    - path: ${SKOJ_ENV_FILE:-.env.docker}
      required: false
  environment: &app-environment
    DJANGO_SETTINGS_MODULE: dmoj.settings
    DB_NAME: ${DB_NAME:-dmoj}
    DB_USER: ${DB_USER:-dmoj}
    DB_PASSWORD: ${DB_PASSWORD:-change-me}
    DMOJ_PROBLEM_DATA_ROOT: /problems
    LOGGING_ROOT: /app/site/tmp/logs
  volumes: &app-volumes
    # 운영에서는 영속 실행 데이터만 mount하며 이 목록에 ./site 소스를 추가하지 않습니다.
    # 정적 파일은 RELEASE_ID 하위 경로를 사용해 이전 릴리스와 함께 보존됩니다.
    - ${STATIC_DIR:-./data/static}:/app/site/tmp/static
    - ${MEDIA_DIR:-./data/media}:/app/site/tmp/media
    - ${LOGS_DIR:-./logs}:/app/site/tmp/logs
    - ${PROBLEMS_DIR:-./problems}:/problems
  depends_on: &app-dependencies
    # Web/Celery/Bridge/init은 공유 DB와 Redis가 실제 healthy일 때만 시작합니다.
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

x-web: &web
  <<: *app
  # 컨테이너 내부 포트는 항상 8000이고 호스트의 Blue/Green 포트만 분리합니다.
  command: ["gunicorn", "dmoj.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "5"]

x-celery: &celery
  <<: *app
  command: ["celery", "-A", "dmoj", "worker", "--loglevel=INFO"]
  healthcheck:
    # $$는 Compose 보간을 피하고 healthcheck가 컨테이너 내부 HOSTNAME을 확장하게 합니다.
    # 자신의 worker node에서 pong이 와야 새 Celery를 정상으로 판단합니다.
    test: ["CMD-SHELL", "celery -A dmoj inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
    interval: 10s
    timeout: 8s
    retries: 12
    start_period: 20s

x-judge: &judge
  # Judge 이미지는 Web 배포 이미지와 수명주기가 달라 필요할 때만 별도로 build합니다.
  build:
    context: .
    dockerfile: docker/judge/Dockerfile
    args:
      DMOJ_RUNTIMES_IMAGE: ${DMOJ_RUNTIMES_IMAGE:-dmoj/runtimes-tier1:latest}
      DMOJ_JUDGE_COMMIT: ${DMOJ_JUDGE_COMMIT:-5ef74c5d6cad9efb2e86a5bb8ff2c90aaa6e435c}
      JAVA17_IMAGE: ${JAVA17_IMAGE:-eclipse-temurin:17-jdk}
  restart: unless-stopped
  cap_add:
    - SYS_PTRACE
  volumes:
    # Judge는 문제 데이터를 읽기만 하며 설정 파일도 읽기 전용으로 mount합니다.
    - ${PROBLEMS_DIR:-./problems}:/problems:ro
    - ./docker/judge/judge.yml:/judge.yml:ro
  depends_on:
    bridge:
      condition: service_started

services:
  # Database, Redis, Bridge, Judge는 Blue와 Green이 공유하며 일반 배포에서 교체하지 않습니다.
  db:
    # 버전을 고정해 애플리케이션 배포가 DB 엔진 업그레이드를 유발하지 않게 합니다.
    image: mariadb:10.11.16-jammy
    restart: unless-stopped
    ports:
      # DB는 외부 네트워크가 아닌 호스트 loopback에서만 접근할 수 있습니다.
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dmoj}
      MARIADB_USER: ${DB_USER:-dmoj}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
    volumes:
      # 컨테이너를 재생성해도 DB 파일은 호스트 디렉터리에 유지됩니다.
      - ${DB_DATA_DIR:-./data/mariadb}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    # Redis도 버전을 고정하고 AOF를 켜 Celery queue의 재시작 내구성을 높입니다.
    image: redis:7.2.15-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 명시적으로 호출하는 관리 도구이며 Web 시작 과정에서는 migration을 자동 실행하지 않습니다.
  init:
    <<: *app
    image: ${SKOJ_TOOL_IMAGE:-skoj-app:local}
    restart: "no"
    profiles: ["tools"]
    # restart.sh가 이 명령을 일회성 컨테이너로 실행해 migration과 초기화를 수행합니다.
    command: ["python", "manage.py", "initialize_docker"]

  # Blue Web은 고정된 호스트 loopback 8001에서 대기합니다.
  web-blue:
    <<: *web
    image: ${SKOJ_BLUE_IMAGE:-skoj-app:local}
    environment:
      <<: *app-environment
      # health 응답과 정적 파일 경로가 실제 이미지 SHA와 일치하도록 전달합니다.
      RELEASE_ID: ${SKOJ_BLUE_RELEASE:-development}
    ports:
      - "127.0.0.1:${BLUE_WEB_HOST_PORT:-8001}:8000"

  # Green Web은 Blue와 동일한 내부 구성으로 고정된 호스트 loopback 8002를 사용합니다.
  web-green:
    <<: *web
    image: ${SKOJ_GREEN_IMAGE:-skoj-app:local}
    environment:
      <<: *app-environment
      RELEASE_ID: ${SKOJ_GREEN_RELEASE:-development}
    ports:
      - "127.0.0.1:${GREEN_WEB_HOST_PORT:-8002}:8000"
    # Green은 일반 compose up에 섞이지 않고 배포 스크립트가 명시할 때만 시작합니다.
    profiles: ["deployment"]

  # Celery도 Web과 같은 이미지·RELEASE_ID의 색상 쌍으로 운영합니다.
  celery-blue:
    <<: *celery
    image: ${SKOJ_BLUE_IMAGE:-skoj-app:local}
    environment:
      <<: *app-environment
      RELEASE_ID: ${SKOJ_BLUE_RELEASE:-development}
    hostname: skoj-celery-blue

  celery-green:
    <<: *celery
    image: ${SKOJ_GREEN_IMAGE:-skoj-app:local}
    environment:
      <<: *app-environment
      RELEASE_ID: ${SKOJ_GREEN_RELEASE:-development}
    hostname: skoj-celery-green
    profiles: ["deployment"]

  bridge:
    <<: *app
    # Bridge 이미지는 별도로 고정하며 일반 Blue/Green 배포에서 재생성하지 않습니다.
    image: ${SKOJ_BRIDGE_IMAGE:-skoj-app:local}
    command: ["python", "manage.py", "runbridged"]
    expose:
      # 포트는 Compose 네트워크의 Judge와 Django에만 노출하고 호스트에는 publish하지 않습니다.
      - "9998"
      - "9999"

  judge:
    <<: *judge
    # 이름과 key는 환경 파일에서 주입하며 기본값은 운영에서 반드시 교체합니다.
    command:
      - run
      - -c
      - /judge.yml
      - bridge
      - ${JUDGE_NAME:-skoj-judge-01}
      - ${JUDGE_KEY:-change-me}

  judge-02:
    <<: *judge
    # 추가 Judge는 같은 Bridge와 읽기 전용 문제 데이터를 공유하는 독립 worker입니다.
    command:
      - run
      - -c
      - /judge.yml
      - bridge
      - ${JUDGE_NAME_2:-skoj-judge-02}
      - ${JUDGE_KEY_2:-change-me}

volumes:
  redis_data:
